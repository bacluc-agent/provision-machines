name: Test settings hook
on:
  push:
    branches: [issue-10]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Stop hook command with jq
        run: jq -e '.hooks.Stop[0].hooks[0].command == "./scripts/completion-check"' deploys/development_tools/ai_agent_devcontainer/files/claude/settings.json
      - name: Prettier check on settings.json
        run: npx --yes prettier@3.6.2 --check deploys/development_tools/ai_agent_devcontainer/files/claude/settings.json
