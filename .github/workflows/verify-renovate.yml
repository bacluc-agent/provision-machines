name: Verify Renovate Dependencies

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshot:
        description: "Update the snapshot file"
        required: false
        default: false
        type: boolean

jobs:
  verify-renovate:
    if: ${{ !inputs.update_snapshot }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod a+x /usr/local/bin/yq

      - name: Check dependencies against snapshot
        run: |
          ./scripts/update-renovate-snapshot.sh --check

      - name: Check dependencies against snapshot
        if: always()
        run: |
          cat /tmp/renovate-err.log

  update-renovate-snapshot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshot }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod a+x /usr/local/bin/yq

      - name: Update snapshot
        run: |
          ./scripts/update-renovate-snapshot.sh --update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/renovate-snapshot.json
          git commit -m "chore: update renovate dependency snapshot [skip ci]" || echo "No changes to commit"
          git push
